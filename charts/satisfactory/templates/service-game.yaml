apiVersion: v1
kind: Service
metadata:
  name: {{ include "satisfactory.fullname" . }}
  labels:
    {{- include "satisfactory.labels" . | nindent 4 }}
  {{- with .Values.service.game.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.game.type }}
  {{- if and (eq .Values.service.game.type "LoadBalancer") .Values.service.game.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.game.loadBalancerIP | quote }}
  {{- end }}
  {{- if and (or (eq .Values.service.game.type "LoadBalancer") (eq .Values.service.game.type "NodePort")) .Values.service.game.externalTrafficPolicy }}
  externalTrafficPolicy: {{ .Values.service.game.externalTrafficPolicy }}
  {{- end }}
  ports:
    - name: game-udp
      port: {{ .Values.server.config.gamePort }}
      targetPort: game-udp
      protocol: UDP
    - name: game-tcp
      port: {{ .Values.server.config.gamePort }}
      targetPort: game-tcp
      protocol: TCP
    - name: messaging-tcp
      port: {{ .Values.server.config.messagingPort }}
      targetPort: messaging-tcp
      protocol: TCP
    {{- if .Values.sftp.enabled }}
    - name: sftp
      port: {{ .Values.sftp.port }}
      targetPort: sftp
      protocol: TCP
    {{- end }}
  selector:
    {{- include "satisfactory.selectorLabels" . | nindent 4 }}
