{{- if and .Values.portal.enabled .Values.portal.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "satisfactory.fullname" . }}
  labels:
    {{- include "satisfactory.labels" . | nindent 4 }}
    {{- with .Values.portal.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "satisfactory.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.portal.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.portal.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
