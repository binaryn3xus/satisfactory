{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "satisfactory.fullname" . }}-tls
  labels:
    {{- include "satisfactory.labels" . | nindent 4 }}
spec:
  secretName: {{ include "satisfactory.fullname" . }}-tls
  duration: {{ .Values.tls.certManager.duration | default "2160h" }}
  renewBefore: {{ .Values.tls.certManager.renewBefore | default "360h" }}
  {{- if .Values.tls.certManager.commonName }}
  commonName: {{ .Values.tls.certManager.commonName | quote }}
  {{- end }}
  dnsNames:
    {{- toYaml .Values.tls.certManager.dnsNames | nindent 4 }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuerRef.name }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | default "ClusterIssuer" }}
{{- end }}
