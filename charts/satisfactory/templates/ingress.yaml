{{- if and .Values.portal.enabled .Values.portal.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "satisfactory.fullname" . }}-saves
  labels:
    {{- include "satisfactory.labels" . | nindent 4 }}
  {{- with .Values.portal.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.portal.ingress.className }}
  ingressClassName: {{ .Values.portal.ingress.className | quote }}
  {{- end }}
  {{- if .Values.portal.ingress.tls }}
  tls:
    {{- toYaml .Values.portal.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.portal.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "satisfactory.fullname" $ }}-saves
                port:
                  number: {{ $.Values.portal.service.port | default 8080 }}
          {{- end }}
    {{- end }}
{{- end }}
