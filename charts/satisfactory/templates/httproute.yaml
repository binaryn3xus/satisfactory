{{- if and .Values.portal.enabled .Values.portal.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "satisfactory.fullname" . }}-saves
  labels:
    {{- include "satisfactory.labels" . | nindent 4 }}
  {{- with .Values.portal.route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.portal.route.parentRefs | nindent 4 }}
  hostnames:
    {{- toYaml .Values.portal.route.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "satisfactory.fullname" . }}-saves
          port: {{ .Values.portal.service.port | default 8080 }}
{{- end }}
