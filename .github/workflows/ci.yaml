name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Go Tests & Helm Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Run Go Unit Tests
        run: go test -v -race ./...

      - name: Verify Helm
        run: |
          command -v helm >/dev/null 2>&1 || curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      - name: Lint Helm Chart
        run: helm lint charts/satisfactory

  build-check:
    name: Build Check (${{ matrix.component }})
    needs: test-and-lint
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - component: satisfactory-server
            dockerfile: images/satisfactory-server/Dockerfile
          - component: satisfactory-portal
            dockerfile: images/satisfactory-portal/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (dry-run)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
